name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Check Firebase Android package configuration
        run: node scripts/check-firebase-config.js

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Run Unit Tests
        continue-on-error: true
        run: bash ./gradlew testDebugUnitTest --no-daemon

      - name: Use committed debug keystore
        run: |
          cp ci-debug.keystore debug.keystore
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA256"

      - name: Check signing SHA-1 against Firebase
        run: |
          SHA1=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep 'SHA1:' | head -1 | awk '{print $2}')
          EXPECTED="E8:75:D0:DA:BB:9C:7E:98:CD:87:0E:F8:15:94:C5:E0:1E:10:C5:BB"
          echo "APK signing SHA-1: $SHA1"
          if [ "$SHA1" = "$EXPECTED" ]; then
            echo "::notice title=Signing SHA-1 OK::$SHA1 matches the fingerprint registered in Firebase"
          else
            echo "::warning title=Signing SHA-1 does NOT match Firebase::This APK is signed with $SHA1 but Firebase has $EXPECTED. Google sign-in will fail until this SHA-1 is added in Firebase."
          fi

      - name: Build Debug APK
        run: bash ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
