name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Check Firebase Android package configuration
        run: node scripts/check-firebase-config.js

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Run Unit Tests
        continue-on-error: true
        run: bash ./gradlew testDebugUnitTest --no-daemon

      - name: Restore stable debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA256"
          else
            echo "Stable keystore secret unavailable; creating temporary keystore for this build."
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Check signing SHA-1 against Firebase
        run: |
          SHA1=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep 'SHA1:' | head -1 | awk '{print $2}')
          EXPECTED="D6:F9:BB:9A:C3:3C:CA:74:7E:06:BA:DB:E4:0C:8F:A7:D5:98:D9:64"
          echo "APK signing SHA-1: $SHA1"
          if [ "$SHA1" = "$EXPECTED" ]; then
            echo "::notice title=Signing SHA-1 OK::$SHA1 matches the fingerprint registered in Firebase"
          else
            echo "::warning title=Signing SHA-1 does NOT match Firebase::This APK is signed with $SHA1 but Firebase has $EXPECTED. Google sign-in will fail until this SHA-1 is added in Firebase."
          fi

      - name: Build Debug APK
        run: bash ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
